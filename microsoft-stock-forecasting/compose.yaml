services:
  mysql:
    image: mysql:8.4
    container_name: msft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: microsoft_stocks
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data_v3:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: msft-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mysql_data_v2:
  mysql_data_v3:
  mongo_data: